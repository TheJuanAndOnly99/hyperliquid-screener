name: Screener

on:
  # Primary trigger: an external scheduler calls workflow_dispatch every 15 minutes (see README).
  # GitHub's own schedule is kept only as a fallback; it fires a few times a day at best.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the latest main, not the commit the run was queued on, so a run that waited
      # behind another one sees that run's log update.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COLUMNS: "170"
        run: python main.py --once
      - name: Save forward-test log
        run: |
          [ -f setups_log.csv ] || exit 0
          git add setups_log.csv
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update setups log"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not save setups_log.csv after 3 attempts"
          exit 1
